<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字雲後台管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f23;
      color: #eee;
      font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      min-height: 100vh;
    }

    /* ── 登入畫面 ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .login-box h1 { font-size: 1.8rem; color: #7eb8f7; margin-bottom: 10px; }
    .login-box p  { color: #888; margin-bottom: 32px; font-size: 0.95rem; }
    #google-btn {
      background: white;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 13px 28px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    #google-btn:hover { background: #f0f0f0; }
    #login-error { color: #f87171; margin-top: 16px; font-size: 0.9rem; min-height: 1.2em; }

    /* ── 後台主體 ── */
    header {
      background: #1a1a2e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #2a2a4a;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.25rem; color: #7eb8f7; flex: 1; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-info span { color: #888; font-size: 0.85rem; }

    .toolbar {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #13132a;
      border-bottom: 1px solid #2a2a4a;
      flex-wrap: wrap;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: #ccc;
      user-select: none;
    }
    .toolbar label input { width: 16px; height: 16px; accent-color: #4a9eff; cursor: pointer; }
    #session-count { color: #666; font-size: 0.85rem; margin-left: auto; }

    button {
      padding: 9px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: background 0.15s;
    }
    #delete-btn { background: #7a1f1f; color: #f87171; }
    #delete-btn:not(:disabled):hover { background: #c0392b; color: white; }
    #delete-btn:disabled { background: #2a2a3a; color: #555; cursor: not-allowed; }
    #refresh-btn { background: #2a2a3e; color: #ccc; }
    #refresh-btn:hover { background: #3a3a4e; }
    #signout-btn { background: #2a2a3e; color: #888; font-size: 0.82rem; padding: 7px 14px; }
    #signout-btn:hover { background: #3a3a4e; }

    #session-list {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 900px;
    }

    .session-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s, background 0.15s;
    }
    .session-card:hover { border-color: #4a4a6a; }
    .session-card.selected { border-color: #4a9eff; background: #141e2e; }
    .session-card input[type=checkbox] {
      width: 17px; height: 17px;
      accent-color: #4a9eff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .session-info { flex: 1; min-width: 0; }
    .session-title { font-size: 1rem; font-weight: bold; color: #ddd; }
    .session-meta { font-size: 0.8rem; color: #666; margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .tag {
      background: #0a0a1a;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .tag.id { color: #ffd700; }
    .tag.date { color: #aaa; letter-spacing: 0; font-family: inherit; }
    .tag.round { color: #7eb8f7; }
    .view-link {
      background: #1a2a40;
      color: #7eb8f7;
      padding: 7px 13px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.82rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .view-link:hover { background: #243a55; }

    #status-area {
      padding: 40px 24px;
      text-align: center;
      color: #555;
      font-size: 0.95rem;
    }

    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e7a46;
      color: #d4f5e4;
      padding: 11px 28px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: #7a1f1f; color: #fca5a5; }
  </style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 文字雲後台管理</h1>
    <p>限管理者帳號登入使用</p>
    <button id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2.01c-.72.48-1.63.76-2.7.76-2.08 0-3.84-1.4-4.47-3.29H1.88v2.07A8 8 0 008.98 17z"/>
        <path fill="#FBBC05" d="M4.51 10.52A4.8 4.8 0 014.26 9c0-.52.09-1.02.25-1.52V5.41H1.88A8 8 0 001 9c0 1.3.31 2.52.88 3.59l2.63-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.19c1.17 0 2.23.4 3.06 1.2l2.3-2.3C12.95 1.7 11.14 1 8.98 1a8 8 0 00-7.1 4.41l2.63 2.07c.63-1.9 2.39-3.29 4.47-3.29z"/>
      </svg>
      使用 Google 帳號登入
    </button>
    <div id="login-error"></div>
  </div>
</div>

<!-- 後台管理主體 -->
<div id="admin-panel" style="display:none">
  <header>
    <h1>📊 文字雲後台管理</h1>
    <div class="user-info">
      <span id="user-email"></span>
      <button id="signout-btn" onclick="signOut()">登出</button>
    </div>
  </header>

  <div class="toolbar">
    <label>
      <input type="checkbox" id="select-all" onchange="toggleSelectAll()">
      全選
    </label>
    <button id="delete-btn" disabled onclick="deleteSelected()">🗑 刪除選取</button>
    <button id="refresh-btn" onclick="loadSessions()">↻ 重新整理</button>
    <span id="session-count"></span>
  </div>

  <div id="session-list"></div>
  <div id="status-area">載入中…</div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyD30cV4rdx1Ys4J4eGnznPieUUhOhWhHrQ",
    authDomain: "teachstudy-b8b64.firebaseapp.com",
    projectId: "teachstudy-b8b64",
    storageBucket: "teachstudy-b8b64.firebasestorage.app",
    messagingSenderId: "195283799004",
    appId: "1:195283799004:web:b212e67d4e30ac95dddd19"
  });

  const db   = firebase.firestore();
  const auth = firebase.auth();
  const ADMIN_EMAIL = 'arthlin@gmail.com';

  // ── 驗證狀態 ──
  auth.onAuthStateChanged(user => {
    if (user && user.email === ADMIN_EMAIL) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display  = 'block';
      document.getElementById('user-email').textContent = user.email;
      loadSessions();
    } else if (user) {
      auth.signOut();
      setLoginError('此帳號無管理權限，請改用 arthlin@gmail.com 登入');
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-panel').style.display  = 'none';
    }
  });

  document.getElementById('google-btn').onclick = () => {
    setLoginError('');
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => setLoginError('登入失敗：' + e.message));
  };

  function setLoginError(msg) {
    document.getElementById('login-error').textContent = msg;
  }

  function signOut() { auth.signOut(); }

  // ── 載入場次 ──
  let sessions = [];

  async function loadSessions() {
    const listEl   = document.getElementById('session-list');
    const statusEl = document.getElementById('status-area');
    const countEl  = document.getElementById('session-count');

    listEl.innerHTML = '';
    statusEl.style.display = 'block';
    statusEl.textContent = '載入中…';
    document.getElementById('select-all').checked = false;
    document.getElementById('delete-btn').disabled = true;

    try {
      const snap = await db.collection('sessions').orderBy('createdAt', 'desc').get();
      sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      if (sessions.length === 0) {
        statusEl.textContent = '目前沒有任何場次';
        countEl.textContent = '';
        return;
      }

      statusEl.style.display = 'none';
      countEl.textContent = `共 ${sessions.length} 個場次`;
      sessions.forEach(s => listEl.appendChild(makeCard(s)));
    } catch (e) {
      statusEl.textContent = '載入失敗：' + e.message;
    }
  }

  function makeCard(s) {
    const base = window.location.href.replace(/admin\.html.*$/, '');
    const date = s.createdAt
      ? new Date(s.createdAt.seconds * 1000).toLocaleString('zh-TW', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit'
        })
      : '—';
    const rounds = Math.max(0, (s.currentRound || 1) - 1);

    const card = document.createElement('div');
    card.className = 'session-card';
    card.dataset.id = s.id;
    card.innerHTML = `
      <input type="checkbox" class="session-check" data-id="${s.id}" onchange="onCheck()">
      <div class="session-info">
        <div class="session-title">${esc(s.title || '（無標題）')}</div>
        <div class="session-meta">
          <span class="tag id">${s.id}</span>
          <span class="tag date">${date}</span>
          ${rounds > 0 ? `<span class="tag round">已清空 ${rounds} 次</span>` : ''}
        </div>
      </div>
      <a class="view-link" href="${base}display.html" target="_blank">開啟</a>
    `;
    return card;
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function onCheck() {
    const all     = document.querySelectorAll('.session-check');
    const checked = document.querySelectorAll('.session-check:checked');
    document.getElementById('delete-btn').disabled = checked.length === 0;
    document.getElementById('select-all').checked  = checked.length === all.length && all.length > 0;
    document.querySelectorAll('.session-card').forEach(card => {
      card.classList.toggle('selected', card.querySelector('.session-check').checked);
    });
  }

  function toggleSelectAll() {
    const v = document.getElementById('select-all').checked;
    document.querySelectorAll('.session-check').forEach(cb => { cb.checked = v; });
    onCheck();
  }

  // ── 批次刪除 ──
  async function deleteSelected() {
    const ids = Array.from(document.querySelectorAll('.session-check:checked')).map(cb => cb.dataset.id);
    if (ids.length === 0) return;

    const names = ids.map(id => {
      const s = sessions.find(x => x.id === id);
      return s ? `「${s.title || id}」(${id})` : id;
    });

    if (!confirm(`確定要永久刪除以下 ${ids.length} 個場次？\n（連同所有字詞，無法復原）\n\n${names.join('\n')}`)) return;

    const btn = document.getElementById('delete-btn');
    btn.disabled = true;
    btn.textContent = '刪除中…';

    try {
      for (const id of ids) await deleteSession(id);
      showToast(`已刪除 ${ids.length} 個場次`);
      loadSessions();
    } catch (e) {
      showToast('刪除失敗：' + e.message, true);
      btn.disabled = false;
      btn.textContent = '🗑 刪除選取';
    }
  }

  async function deleteSession(sessionId) {
    const ref = db.collection('sessions').doc(sessionId);

    // 先刪子集合 words（Firestore 不會自動級聯刪除）
    const wordsSnap = await ref.collection('words').get();
    if (!wordsSnap.empty) {
      const BATCH = 400;
      let batch = db.batch(), count = 0;
      for (const doc of wordsSnap.docs) {
        batch.delete(doc.ref);
        if (++count >= BATCH) {
          await batch.commit();
          batch = db.batch();
          count = 0;
        }
      }
      if (count > 0) await batch.commit();
    }

    // 再刪 session 本身
    await ref.delete();
  }

  function showToast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 3000);
  }
</script>
</body>
</html>
